<section class="auth">
  <form class="auth__card" [formGroup]="form" (ngSubmit)="enviar()">
    <h1>Crear cuenta</h1>
    <p class="auth__hint">Registrate y llevate 20% off en tu primera compra.</p>

    @if (confirmarEmail()) {
      <p class="auth__success">
        ¡Listo! Revisá tu email para confirmar la cuenta antes de iniciar sesión.
      </p>
    } @else {
      <div class="auth__grid">
        <label>
          Nombre
          <input type="text" formControlName="nombre" />
        </label>
        <label>
          Apellido
          <input type="text" formControlName="apellido" />
        </label>
      </div>

      <label>
        Email
        <input type="email" formControlName="email" autocomplete="email" />
      </label>

      <label>
        Contraseña
        <input type="password" formControlName="password" autocomplete="new-password" />
      </label>

      <label>
        Fecha de nacimiento
        <input type="date" formControlName="fecha_nacimiento" />
      </label>

      <div class="auth__grid">
        <label>
          Tipo de sangre (opcional)
          <input type="text" formControlName="tipo_sangre" placeholder="O+" />
        </label>
        <label>
          Color de ojos (opcional)
          <input type="text" formControlName="color_ojos" placeholder="Marrón" />
        </label>
      </div>

      <label>
        Días de vacaciones por año (opcional)
        <input type="number" formControlName="dias_vacaciones" min="0" />
      </label>

      @if (error()) {
        <p class="auth__error">{{ error() }}</p>
      }

      <button type="submit" [disabled]="cargando()">
        {{ cargando() ? 'Creando cuenta...' : 'Registrarme' }}
      </button>
    }

    <p class="auth__aside">
      ¿Ya tenés cuenta? <a routerLink="/login">Iniciá sesión</a>
    </p>
  </form>
</section>
